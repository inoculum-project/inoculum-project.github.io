{{ define "main" }}
<div class="page-header">
  <div class="container">
    <div class="page-header__eyebrow">{{ .Section | default "Page" }}</div>
    <h1 class="page-header__title">{{ .Title }}</h1>
    {{ with .Params.description }}<p class="page-header__desc">{{ . }}</p>{{ end }}
  </div>
</div>
<section>
  <div class="container--text">
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
