<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
<style>
  .logo-bg { fill: #08090c; }
  .ring1   { fill: none; stroke: #c8922a; stroke-width: 0.8; }
  .ring2   { fill: none; stroke: #4a8f87; stroke-width: 0.6; stroke-dasharray: 3 7; }
  .ring3   { fill: none; stroke: #c8922a; stroke-width: 0.4; stroke-dasharray: 1 10; }
  .spoke   { stroke: #242736; stroke-width: 0.4; fill: none; }
  .cow-fill{ fill: #13151c; stroke: #d4c9a8; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .spot    { fill: #1a1d26; stroke: #c8922a; stroke-width: 0.7; }
  .syr-fill{ fill: #13151c; stroke: #4a8f87; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .syr-liq { fill: #4a8f87; opacity: 0.5; }
  .syringe { fill: none; stroke: #4a8f87; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .node-dot { fill: #c8922a; }
  .node-teal{ fill: #4a8f87; }
  .wordmark { font-family: 'Cormorant Garamond', Georgia, serif; fill: #d4c9a8; font-weight: 300; letter-spacing: 0.18em; }
  .sub      { font-family: 'JetBrains Mono', monospace; fill: #7a7468; font-weight: 400; letter-spacing: 0.22em; }
  .amber-line { stroke: #c8922a; stroke-width: 0.5; fill: none; }
</style>

<rect width="680" height="480" class="logo-bg"/>

