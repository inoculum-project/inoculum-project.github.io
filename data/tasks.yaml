- id: "T1"
  number: 1
  title: "Management and Dissemination"
  start: "May 2026"
  end: "May 2029"
  classification: "Project Management"
  leader: "João Paulo"
  color: "teal"
  description: "Manages project progress within budget and schedule. Implements internal communication strategy, monthly PI meetings, progress tracking, quality assurance, and risk management. Produces three yearly reports, project website, and coordinates all dissemination activities including publications, social media, workshops, and open-source releases."

- id: "T2"
  number: 2
  title: "Ransomware-Resilient Secure-By-Design Solution"
  start: "May 2026"
  end: "Apr 2027"
  classification: "Industrial Research"
  leader: "João Paulo, Ricardo Macedo"
  color: "amber"
  description: "Designs and implements a proof-of-concept file system using Copy-on-Write (CoW) and a Write-Once-Read-Many (WORM) strategy. Exposes a standard POSIX API with no application changes required. Immutable copies are generated for every write — ransomware encryption always lands on a new version, leaving previous data intact and fully recoverable without periodic backups or costly cloud services."

- id: "T3"
  number: 3
  title: "High-Performance Storage Optimizations"
  start: "Nov 2026"
  end: "Apr 2028"
  classification: "Industrial Research"
  leader: "João Paulo, Cláudia Brito"
  color: "amber"
  description: "Reduces storage overhead via deduplication, delta-encoding, and compression (up to 83% space reduction). Explores high-performance I/O frameworks — SPDK and io_uring — to minimise CoW overhead on NVMe-class storage appliances and enterprise solutions. Novel caching and prefetching algorithms improve metadata access. Reinforcement Learning (Q-learning, Deep RL, PPO) auto-tunes all parameters."

- id: "T4"
  number: 4
  title: "Personalized Data Protection"
  start: "May 2027"
  end: "Nov 2028"
  classification: "Industrial Research"
  leader: "João Paulo, Tânia Esteves"
  color: "amber"
  description: "Explores differentiated protection levels based on data criticality. Initially user-defined, then automated via Decision Trees, Association Rule Mining, and Hidden Markov Models monitoring data aging, access patterns, and entropy. Files with lower access frequency receive fewer copies; suspicious changes trigger automatic level upgrades."

- id: "T5"
  number: 5
  title: "Use Cases and Integration"
  start: "May 2027"
  end: "May 2029"
  classification: "Experimental Development"
  leader: "João Paulo, João Marco Silva"
  color: "teal"
  description: "Integrates all outputs from Tasks 2–4 into a unified prototype. Validates against real ransomware families (WannaCry, Erebus, REvil, DARKSIDE) and benchmarks on high-performance storage appliances with realistic I/O workloads. Follows DevOps/GIT methodology with automated testing. Produces the patent request submission."
